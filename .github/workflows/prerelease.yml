name: Publish prerelease

on:
  push:
    branches:
      - 'codex/prerelease/v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate prerelease version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#codex/prerelease/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$ ]]
          version="${tag#v}"
          test -f "docs/releases/$tag.md"
          node - "$version" <<'JS'
          const fs = require('fs');
          const expected = process.argv[2];
          const cargo = fs.readFileSync('Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)[1];
          const manifest = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('frontend/package-lock.json', 'utf8'));
          if ([cargo, manifest.version, lock.version, lock.packages[''].version].some(v => v !== expected)) {
            throw new Error('Version files must match the prerelease branch');
          }
          JS
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$version" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_tag: ${{ needs.prepare.outputs.image_tag }}

  release:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG 测试版" \
            --prerelease --latest=false \
            --notes-file "docs/releases/$RELEASE_TAG.md"
