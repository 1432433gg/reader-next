name: Publish Docker image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional extra image tag, e.g. vx.y.z-test"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency: reader-next-docker-publish

env:
  IMAGE_NAME: ghcr.io/1432433gg/reader-next

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tags before pushing
        id: tags
        env:
          EXTRA_TAG: ${{ inputs.image_tag }}
        run: |
          tags=$(bash scripts/image-tags.sh "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$EXTRA_TAG")
          printf 'tags=%s\n' "$(paste -sd, <<< "$tags")" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false

      - name: Build and push digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Create multi-arch manifest
    runs-on: ubuntu-latest
    needs: [tags, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ $IMAGE_TAGS == 1.2.1 ]]; then
            if result=$(docker buildx imagetools inspect "$IMAGE_NAME:1.2.1" 2>&1); then
              echo "Reader 1.2.1 is already published; compare the existing digest before resuming." >&2
              exit 1
            fi
            if ! grep -Eqi 'not found|manifest unknown' <<< "$result"; then
              echo "$result" >&2
              exit 1
            fi
          fi
          IFS=, read -r -a tags <<< "$IMAGE_TAGS"
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "$IMAGE_NAME:$tag")
          done
          sources=()
          for digest in *; do
            [[ $digest =~ ^[a-f0-9]{64}$ ]]
            sources+=("$IMAGE_NAME@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]]
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE_NAME:${tags[0]}"
