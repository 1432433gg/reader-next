<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c97f3a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141414" />
    <meta name="color-scheme" content="light dark" />
    <meta name="msapplication-navbutton-color" content="#c97f3a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      状态栏用 default（不透明，颜色取 theme-color），页面内容不在状态栏下面。
      iOS 26 不管状态栏透不透明，都会在网页顶部加一层约 20px 的模糊，阅读页靠正文下移避开
      （ReaderView.vue 的 --reader-top-extra）。
      iOS 只在「添加到主屏幕」时读这个设置，改了以后要删掉主屏幕图标重新添加。
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="阅读" />

    <!--
      图标地址带版本号：手机按地址缓存图标，地址不变就一直用旧图（iPhone 添加到主屏幕时尤其明显）。
      换了图标就把 v= 加 1，和 public/site.webmanifest、public/sw.js 里的一起改。
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <title>阅读</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
