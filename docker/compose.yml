services:
  reader:
    image: ${READER_IMAGE:-ghcr.io/1432433gg/reader-next:latest}
    container_name: reader-next
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 18080
      DATABASE_URL: sqlite:/app/storage/reader.db?mode=rwc
      STORAGE_DIR: /app/storage
      ASSETS_DIR: /app/storage/assets
      WEB_ROOT: /app/web/dist
      LOG_LEVEL: info
      REQUEST_TIMEOUT_SECS: 15
    ports:
      - "${READER_PORT:-18080}:18080"
    volumes:
      - reader-storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  remote-webview:
    image: reader-next-webview:3.2.0-postfix3
    build:
      context: ./remote-webview
    pull_policy: build
    container_name: reader-next-remote-webview
    restart: unless-stopped
    profiles: ["webview"]
    expose:
      - "8050"

volumes:
  reader-storage:
